name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # PySide6's shared objects need these even for the offscreen platform.
      # Without libEGL, importing QtGui fails and pytest-qt takes the whole
      # suite down before a test runs. Installing them means the UI tests
      # actually run here rather than being quietly skipped, which is the
      # point of having them.
      - name: Qt runtime libraries
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install
        run: uv sync --all-extras || uv pip install --system -e ".[dev]"

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Test
        # The UI tests need a Qt platform plugin but not a display.
        #
        # The performance budgets in the design are targets for the machine a
        # person works on. A shared runner is slower and noisier, so asserting
        # them unscaled here measures the runner, not Structura: two runs
        # failed on commits that changed only documentation. The budgets
        # themselves were also re-set against real measurements; this scale is
        # the remaining insurance against a bad runner, not a way of passing.
        env:
          STRUCTURA_PERF_SCALE: "1.5"
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

      # A guard against the fallback in conftest.py becoming the norm. If Qt
      # ever stops importing here, the suite still passes -- with the UI tests
      # silently gone. This says so out loud instead.
      - name: The UI tests really ran
        run: uv run python -c "import PySide6.QtGui; print('Qt imports:', PySide6.__version__)"
