# Dagr — the light half of the pair. Named for the Norse personification of
# Day, son of Nótt. Morning-light-on-parchment: a warm cream ground with
# deepened, earthier counterparts of the same accent roles.
#
# The role architecture is identical to Nótt's, which is the point: switching
# preserves meaning rather than merely inverting lightness.

name = "Dagr"
variant = "light"

[editor]
background = "#F5F1E4"
current_line = "#EDE9DB"
selection = "#C9D1DF"
foreground = "#1F2330"
comment = "#6B6A58"
red = "#B53D3A"
orange = "#8F5C18"
yellow = "#6E601A"
green = "#3A6525"
cyan = "#2B6A8A"
purple = "#5B4A9E"
pink = "#A84272"

